name: US100 VWAP Trading Bot

on:
  schedule:
    # Broad UTC coverage; the application enforces the 10:00-15:00
    # America/New_York window and therefore handles both DST regimes.
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trade-lab-live-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Prepare state cache key
        id: state
        shell: bash
        run: |
          state_date="$(TZ=America/New_York date +%F)"
          echo "date=$state_date" >> "$GITHUB_OUTPUT"
          echo "key=trade-state-$state_date-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Restore latest state for the New York trading day
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            .state/state.json
            .state/state.json.bak
          key: ${{ steps.state.outputs.key }}
          restore-keys: |
            trade-state-${{ steps.state.outputs.date }}-

      # A cache miss before 10:00 New York time is the only safe first-run
      # bootstrap window. During the session, a miss could mean eviction and
      # loss of today's alert history, so fail closed.
      - name: Validate or bootstrap state cache
        if: github.event_name == 'schedule'
        env:
          CACHE_MATCHED_KEY: ${{ steps.restore-state.outputs.cache-matched-key }}
        run: |
          python -m trade_lab.cache_guard --matched-key "$CACHE_MATCHED_KEY" --state-file .state/state.json

      - name: Run live monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          STATE_FILE: .state/state.json
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m trade_lab.live
          else
            python -m trade_lab.live --dry-run
          fi

      # Never manufacture an empty state file or save after a failed run.
      # A successful scheduled invocation may persist state only if the
      # application actually produced/updated a valid state file.
      - name: Save state for subsequent scheduled runs
        if: success() && github.event_name == 'schedule' && hashFiles('.state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .state/state.json
            .state/state.json.bak
          key: ${{ steps.state.outputs.key }}
